<svg xmlns="http://www.w3.org/2000/svg" width="280" height="64" viewBox="0 0 280 64" fill="none">
  <!-- BeeMark from components/Logo.jsx -->
  <g transform="translate(4, 0)">
    <!-- flower stem -->
    <path d="M50 30 C49 40 48 48 47 56" stroke="#241C12" stroke-width="1.6" fill="none" stroke-linecap="round" />
    <!-- daisy petals -->
    <g transform="translate(50, 26)">
      <ellipse cx="0" cy="-7" rx="2.2" ry="6" transform="rotate(0)" fill="#FBF7EF" stroke="#241C12" stroke-width="1.1" />
      <ellipse cx="0" cy="-7" rx="2.2" ry="6" transform="rotate(30)" fill="#FBF7EF" stroke="#241C12" stroke-width="1.1" />
      <ellipse cx="0" cy="-7" rx="2.2" ry="6" transform="rotate(60)" fill="#FBF7EF" stroke="#241C12" stroke-width="1.1" />
      <ellipse cx="0" cy="-7" rx="2.2" ry="6" transform="rotate(90)" fill="#FBF7EF" stroke="#241C12" stroke-width="1.1" />
      <ellipse cx="0" cy="-7" rx="2.2" ry="6" transform="rotate(120)" fill="#FBF7EF" stroke="#241C12" stroke-width="1.1" />
      <ellipse cx="0" cy="-7" rx="2.2" ry="6" transform="rotate(150)" fill="#FBF7EF" stroke="#241C12" stroke-width="1.1" />
      <ellipse cx="0" cy="-7" rx="2.2" ry="6" transform="rotate(180)" fill="#FBF7EF" stroke="#241C12" stroke-width="1.1" />
      <ellipse cx="0" cy="-7" rx="2.2" ry="6" transform="rotate(210)" fill="#FBF7EF" stroke="#241C12" stroke-width="1.1" />
      <ellipse cx="0" cy="-7" rx="2.2" ry="6" transform="rotate(240)" fill="#FBF7EF" stroke="#241C12" stroke-width="1.1" />
      <ellipse cx="0" cy="-7" rx="2.2" ry="6" transform="rotate(270)" fill="#FBF7EF" stroke="#241C12" stroke-width="1.1" />
      <ellipse cx="0" cy="-7" rx="2.2" ry="6" transform="rotate(300)" fill="#FBF7EF" stroke="#241C12" stroke-width="1.1" />
      <ellipse cx="0" cy="-7" rx="2.2" ry="6" transform="rotate(330)" fill="#FBF7EF" stroke="#241C12" stroke-width="1.1" />
      <circle cx="0" cy="0" r="4.2" fill="#EFBE55" stroke="#241C12" stroke-width="1.1" />
    </g>
    <!-- bee body -->
    <g transform="rotate(38 26 30)">
      <path d="M14 30 a12 9 0 0 1 24 0 a12 9 0 0 1 -24 0 Z" fill="#EFBE55" stroke="#241C12" stroke-width="1.6" />
      <path d="M20 21.8 c-1.4 5.4 -1.4 11 0 16.4 l4.6 0 c-1.6 -5.4 -1.6 -11 0 -16.4 Z" fill="#241C12" />
      <path d="M29 21.4 c-1.4 5.6 -1.4 11.6 0 17.2 l4.4 -0.6 c-1.3 -5.2 -1.3 -10.8 0 -16 Z" fill="#241C12" />
      <!-- stinger -->
      <path d="M38 30 l5 0" stroke="#241C12" stroke-width="1.6" stroke-linecap="round" />
      <!-- head -->
      <circle cx="13" cy="30" r="4.6" fill="#241C12" />
      <!-- antennae -->
      <path d="M11 26 C9 22 7 20 4.5 19" stroke="#241C12" stroke-width="1.4" fill="none" stroke-linecap="round" />
      <path d="M13.5 25.5 C13 21.5 12 19 10 17" stroke="#241C12" stroke-width="1.4" fill="none" stroke-linecap="round" />
      <circle cx="4.5" cy="19" r="1.6" fill="#EFBE55" />
      <circle cx="10" cy="17" r="1.6" fill="#EFBE55" />
      <!-- wings -->
      <ellipse cx="20" cy="17" rx="7.5" ry="4.4" transform="rotate(-28 20 17)" fill="#FBF7EF" stroke="#241C12" stroke-width="1.5" />
      <ellipse cx="29" cy="16" rx="6" ry="3.6" transform="rotate(-14 29 16)" fill="#EFBE55" stroke="#241C12" stroke-width="1.5" />
    </g>
  </g>
  <!-- Brand text -->
  <text x="76" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#241C12" letter-spacing="-0.5">BUZZORA<tspan fill="#D99A34">.</tspan></text>
  <!-- Tagline -->
  <text x="77" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#6B5F4C" letter-spacing="1.5">FROM HIVE TO HEART</text>
</svg>
